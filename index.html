<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小兔子向前衝 - 程式編程闖關遊戲</title>
<style>
  :root {
    --primary: #ff9800;
    --green: #4caf50;
    --red: #f44336;
    --blue: #2196f3;
    --bg: #fffdf5;
  }
  * { box-sizing: border-box; user-select: none; }
  body {
    font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(180deg, #e0f7fa 0%, #fff9c4 100%);
    margin: 0; padding: 12px; min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-card {
    background: #fff; width: 92%; max-width: 420px; border-radius: 24px;
    padding: 28px 24px; text-align: center; border: 5px solid #ffb74d;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popUp { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-card h2 { margin-top: 0; color: #d84315; font-size: 28px; }
  .input-group { margin-bottom: 14px; text-align: left; }
  .input-group label { display: block; font-weight: bold; margin-bottom: 4px; color: #555; }
  .input-group input {
    width: 100%; padding: 10px 12px; font-size: 16px;
    border: 2px solid #ccc; border-radius: 10px;
  }
  .btn {
    padding: 12px 24px; font-size: 18px; font-weight: bold; border: none;
    border-radius: 14px; cursor: pointer; color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2); transition: transform 0.1s;
  }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn:disabled { background: #bbb !important; box-shadow: none; cursor: not-allowed; }
  .btn-green { background: var(--green); }
  .btn-orange { background: var(--primary); }
  .btn-red { background: var(--red); }
  .btn-blue { background: var(--blue); }

  #app {
    width: 100%; max-width: 820px; background: var(--bg);
    border-radius: 24px; border: 5px solid #8d6e63;
    padding: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  header {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: center; gap: 8px; padding-bottom: 12px;
    border-bottom: 3px dashed #ffd54f; margin-bottom: 14px;
  }
  .title-badge {
    font-size: 24px; font-weight: 900; color: #d84315;
    background: #ffe082; padding: 6px 14px; border-radius: 14px;
    border: 3px solid #ffa000;
  }
  .status-bar { display: flex; gap: 10px; align-items: center; font-weight: bold; font-size: 15px; flex-wrap: wrap; }
  .pill { background: #fff; padding: 6px 12px; border-radius: 20px; border: 2px solid #ffb74d; }

  .main-area { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  @media (max-width: 680px) { .main-area { grid-template-columns: 1fr; } }

  #board {
    aspect-ratio: 5 / 4; width: 100%; background: #222;
    border: 4px solid #222; border-radius: 12px;
    display: grid; grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr); gap: 3px; position: relative;
    overflow: hidden;
  }
  .cell {
    background: #fff; position: relative;
    display: flex; justify-content: center; align-items: center;
  }
  .obstacle-box {
    width: 78%; height: 78%; background: #ef4444;
    border: 3px solid #b91c1c; border-radius: 10px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
  }
  #player {
    position: absolute; width: 20%; height: 25%;
    top: 0; left: 0; z-index: 20;
    display: flex; justify-content: center; align-items: center;
    transition: left 0.45s ease, top 0.45s ease;
    pointer-events: none;
  }
  #player-inner {
    width: 86%; height: 86%; transition: transform 0.4s ease;
    display: flex; justify-content: center; align-items: center;
  }

  .panel { display: flex; flex-direction: column; gap: 12px; }
  .cards-box {
    background: #fff3e0; border: 3px solid #ffb74d; border-radius: 16px; padding: 10px;
  }
  .cards-title { font-weight: bold; color: #e65100; margin-bottom: 8px; font-size: 15px; }
  .cards-row { display: flex; justify-content: space-around; gap: 8px; }
  .cmd-card {
    flex: 1; padding: 10px 6px; border-radius: 12px; text-align: center;
    font-weight: bold; cursor: pointer; border: 3px solid #5d4037;
    box-shadow: 0 4px 0 #5d4037; transition: transform 0.1s;
  }
  .cmd-card:active { transform: translateY(3px); box-shadow: none; }
  .card-left, .card-right { background: #ffab40; color: #3e2723; }
  .card-move { background: #90caf9; color: #0d47a1; }
  .cmd-icon { font-size: 24px; display: block; line-height: 1.1; }

  #slot-box {
    flex: 1; min-height: 150px; background: #e8f5e9;
    border: 3px dashed #4caf50; border-radius: 16px; padding: 10px;
    display: flex; flex-direction: column;
  }
  #slot-list {
    display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; flex: 1;
  }
  .slot-item {
    padding: 6px 10px; border-radius: 10px; font-weight: bold; font-size: 14px;
    border: 2px solid #333; cursor: pointer; display: flex; align-items: center; gap: 4px;
    background: #fff;
  }
  .slot-item.left, .slot-item.right { background: #ffe0b2; }
  .slot-item.move { background: #bbdefb; }
  .slot-item.active {
    outline: 4px solid #ffeb3b; transform: scale(1.12); z-index: 5;
    box-shadow: 0 0 12px rgba(255,193,7,0.9);
  }
  .slot-item:hover::after { content: '✖'; color: var(--red); margin-left: 4px; }

  .controls-row { display: flex; gap: 10px; }
  .controls-row .btn { flex: 1; padding: 12px; font-size: 18px; }

  .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
  .lvl-btn {
    padding: 10px; border-radius: 10px; border: 2px solid #ccc;
    font-weight: bold; cursor: pointer; background: #eee;
  }
  .lvl-btn.unlocked { background: #fff9c4; border-color: #fbc02d; color: #d84315; }
  .lvl-btn.done { background: #c8e6c9; border-color: #4caf50; color: #1b5e20; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
  th { background: #ffe082; color: #5d4037; }

  /* 自訂彩色提示彈窗樣式 */
  #custom-alert-modal .modal-card {
    border-color: #42a5f5;
    background: #e3f2fd;
  }
</style>
</head>
<body>

<!-- 1. 學生登入視窗 -->
<div id="login-modal" class="modal">
  <div class="modal-card">
    <h2>🐰 小兔子向前衝</h2>
    <p style="color:#666; font-size:14px; margin-top:-8px;">請輸入帳號與密碼開始闖關</p>
    <div class="input-group">
      <label>👤 學生帳號 (學號)</label>
      <input type="text" id="login-user" placeholder="請輸入學號或帳號" value="test">
    </div>
    <div class="input-group">
      <label>🔑 登入密碼</label>
      <input type="password" id="login-pass" placeholder="請輸入密碼" value="1234">
    </div>
    <div id="login-msg" style="font-size:14px; min-height:22px; margin-bottom:8px; font-weight:bold;"></div>
    <button class="btn btn-green" id="login-btn" style="width:100%;" onclick="handleLogin()">🚀 登入並開始遊戲</button>
  </div>
</div>

<!-- 2. 自訂彩色提示彈窗 -->
<div id="custom-alert-modal" class="modal" style="display:none;">
  <div class="modal-card">
    <div id="custom-alert-icon" style="font-size: 48px; margin-bottom: 8px;">🎉</div>
    <div id="custom-alert-msg" style="font-size: 20px; font-weight: bold; color: #0d47a1; margin-bottom: 20px; line-height: 1.4;">提示訊息</div>
    <button class="btn btn-blue" style="width: 100%;" onclick="closeCustomAlert()">確定</button>
  </div>
</div>

<!-- 3. 遊戲主畫面 -->
<div id="app" style="display:none;">
  <header>
    <div class="title-badge">小兔子向前衝</div>
    <div class="status-bar">
      <span class="pill" id="student-badge">👤 載入中</span>
      <span class="pill">🚩 第 <span id="lvl-num">1</span> / 20 關</span>
      <span class="pill">⏱️ <span id="timer-num">0</span> 秒</span>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-orange" style="padding:6px 12px; font-size:14px;" onclick="openLevelsModal()">🗺️ 選關</button>
      <button class="btn btn-blue" style="padding:6px 12px; font-size:14px;" onclick="openRankModal()">🏆 排行榜</button>
    </div>
  </header>

  <div class="main-area">
    <div>
      <div id="board"></div>
      <div style="margin-top:8px; font-size:14px; color:#5d4037; display:flex; justify-content:space-between;">
        <span>💡 看準小兔車頭的<b>黃色箭頭方向</b>喔！</span>
        <span id="start-dir-hint" style="font-weight:bold; color:#d84315;"></span>
      </div>
    </div>

    <div class="panel">
      <div class="cards-box">
        <div class="cards-title">👇 點擊或拖曳指令牌到下方編程區：</div>
        <div class="cards-row">
          <div class="cmd-card card-left" draggable="true" ondragstart="dragCard(event,'left')" onclick="addCmd('left')">
            <span class="cmd-icon">↰</span>轉左<br><small>(原地左轉90°)</small>
          </div>
          <div class="cmd-card card-move" draggable="true" ondragstart="dragCard(event,'move')" onclick="addCmd('move')">
            <span class="cmd-icon">▶</span>移動1格<br><small>(向車頭前進)</small>
          </div>
          <div class="cmd-card card-right" draggable="true" ondragstart="dragCard(event,'right')" onclick="addCmd('right')">
            <span class="cmd-icon">↱</span>轉右<br><small>(原地右轉90°)</small>
          </div>
        </div>
      </div>

      <div id="slot-box" ondragover="event.preventDefault()" ondrop="dropCard(event)">
        <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:bold; color:#2e7d32; margin-bottom:6px;">
          <span>🧩 程式排程（點擊可刪除）：</span>
          <span id="step-count">0 步</span>
        </div>
        <div id="slot-list"></div>
      </div>

      <div class="controls-row">
        <button class="btn btn-red" onclick="clearCmds()">🗑️ 清空重來</button>
        <button class="btn btn-green" id="go-btn" onclick="runProgram()">▶️ 開始行動 (GO)</button>
      </div>
    </div>
  </div>
</div>

<!-- 4. 選關視窗 -->
<div id="levels-modal" class="modal" style="display:none;">
  <div class="modal-card" style="max-width:480px;">
    <h2>🗺️ 選擇關卡</h2>
    <div class="level-grid" id="level-grid"></div>
    <label style="display:block; margin:10px 0; font-size:14px; cursor:pointer;">
      <input type="checkbox" id="teacher-unlock" onchange="renderLevelButtons()"> 👩‍🏫 老師測試模式（解鎖全部 20 關）
    </label>
    <button class="btn btn-orange" onclick="closeModal('levels-modal')">返回遊戲</button>
  </div>
</div>

<!-- 5. 排行榜視窗 -->
<div id="rank-modal" class="modal" style="display:none;">
  <div class="modal-card" style="max-width:520px;">
    <h2>🏆 全班闖關排行榜</h2>
    <div style="max-height:280px; overflow-y:auto;">
      <table>
        <thead><tr><th>名次</th><th>班級</th><th>姓名</th><th>完成關卡</th><th>累計時間</th></tr></thead>
        <tbody id="rank-tbody"></tbody>
      </table>
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-orange" onclick="closeModal('rank-modal')">關閉</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbz_5Jc-0m1hcKtDKUt_VPXFCZlBMimzH_HqgnOdxd-sIlb92Ba_DU3uB9b64akKbkmFuQ/exec";

const BACKUP_USERS = [
  { account: "test", password: "1234", cls: "測試班", name: "測試小勇士", completedLevels: 0, totalTime: 0 },
  { account: "2A01", password: "1234", cls: "2A", name: "1號同學", completedLevels: 0, totalTime: 0 }
];

const LEVELS = [
  { level: 1, start: {x:2, y:3, dir:0}, target: {x:2, y:1}, obstacles: [{x:1, y:2}, {x:3, y:2}] },
  { level: 2, start: {x:1, y:3, dir:0}, target: {x:3, y:1}, obstacles: [{x:1, y:0}, {x:2, y:2}] },
  { level: 3, start: {x:3, y:3, dir:0}, target: {x:1, y:1}, obstacles: [{x:2, y:2}, {x:3, y:0}] },
  { level: 4, start: {x:3, y:3, dir:0}, target: {x:2, y:1}, obstacles: [{x:1, y:2}, {x:3, y:2}, {x:2, y:3}] },
  { level: 5, start: {x:1, y:1, dir:0}, target: {x:0, y:3}, obstacles: [{x:1, y:2}, {x:1, y:3}, {x:2, y:3}] },
  { level: 6, start: {x:3, y:1, dir:3}, target: {x:0, y:3}, obstacles: [{x:0, y:2}, {x:1, y:2}, {x:3, y:2}, {x:1, y:3}] },
  { level: 7, start: {x:0, y:3, dir:0}, target: {x:2, y:1}, obstacles: [{x:0, y:1}, {x:1, y:2}, {x:2, y:2}] },
  { level: 8, start: {x:0, y:1, dir:1}, target: {x:3, y:3}, obstacles: [{x:2, y:1}, {x:1, y:2}, {x:2, y:3}] },
  { level: 9, start: {x:4, y:0, dir:2}, target: {x:1, y:2}, obstacles: [{x:4, y:2}, {x:2, y:1}, {x:2, y:2}] },
  { level: 10, start: {x:1, y:2, dir:0}, target: {x:3, y:2}, obstacles: [{x:2, y:2}, {x:2, y:1}, {x:1, y:3}] },
  { level: 11, start: {x:0, y:3, dir:1}, target: {x:4, y:0}, obstacles: [{x:2, y:3}, {x:2, y:2}, {x:2, y:0}] },
  { level: 12, start: {x:4, y:3, dir:0}, target: {x:0, y:1}, obstacles: [{x:4, y:1}, {x:2, y:2}, {x:1, y:2}] },
  { level: 13, start: {x:0, y:0, dir:2}, target: {x:3, y:1}, obstacles: [{x:1, y:0}, {x:1, y:1}, {x:2, y:2}] },
  { level: 14, start: {x:2, y:2, dir:0}, target: {x:1, y:1}, obstacles: [{x:2, y:0}, {x:1, y:2}, {x:3, y:0}] },
  { level: 15, start: {x:0, y:3, dir:0}, target: {x:4, y:3}, obstacles: [{x:1, y:3}, {x:1, y:2}, {x:3, y:1}, {x:3, y:2}] },
  { level: 16, start: {x:2, y:2, dir:2}, target: {x:0, y:0}, obstacles: [{x:2, y:3}, {x:1, y:1}, {x:3, y:1}] },
  { level: 17, start: {x:4, y:0, dir:3}, target: {x:1, y:3}, obstacles: [{x:2, y:0}, {x:2, y:1}, {x:0, y:2}, {x:3, y:3}] },
  { level: 18, start: {x:0, y:1, dir:0}, target: {x:4, y:2}, obstacles: [{x:1, y:0}, {x:1, y:1}, {x:3, y:2}, {x:3, y:3}] },
  { level: 19, start: {x:4, y:3, dir:3}, target: {x:0, y:0}, obstacles: [{x:2, y:3}, {x:3, y:1}, {x:1, y:2}, {x:1, y:0}] },
  { level: 20, start: {x:0, y:3, dir:1}, target: {x:4, y:0}, obstacles: [{x:1, y:3}, {x:1, y:1}, {x:2, y:2}, {x:3, y:0}, {x:3, y:1}] }
];

let currentUser = null;
let currentLevelIdx = 0;
let commands = [];
let playerState = { x: 0, y: 0, dir: 0 };
let isRunning = false;
let timerInterval = null;
let alertCallback = null;

// 自訂漂亮的彈窗函數
function showCustomAlert(msg, icon = "🎉", callback = null) {
  document.getElementById('custom-alert-msg').innerText = msg;
  document.getElementById('custom-alert-icon').innerText = icon;
  document.getElementById('custom-alert-modal').style.display = 'flex';
  alertCallback = callback;
}

function closeCustomAlert() {
  document.getElementById('custom-alert-modal').style.display = 'none';
  if (typeof alertCallback === 'function') {
    alertCallback();
    alertCallback = null;
  }
}

async function handleLogin() {
  const acc = document.getElementById('login-user').value.trim();
  const pwd = document.getElementById('login-pass').value.trim();
  const msgEl = document.getElementById('login-msg');
  const loginBtn = document.getElementById('login-btn');

  if (!acc || !pwd) {
    msgEl.style.color = "var(--red)";
    msgEl.innerText = "⚠️ 請輸入帳號與密碼！";
    return;
  }
  
  msgEl.style.color = "#2e7d32";
  msgEl.innerText = "🔄 正在連線 Google 試算表驗證中...";
  loginBtn.disabled = true;

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', account: acc, password: pwd })
    });
    const data = await res.json();
    if (data.status === 'success') {
      initGameSession(data.user);
      return;
    } else {
      msgEl.style.color = "var(--red)";
      msgEl.innerText = "❌ " + (data.message || "帳號或密碼錯誤！");
      loginBtn.disabled = false;
      return;
    }
  } catch (err) {
    console.warn("雲端連線失敗，啟動備用離線驗證", err);
    const backup = BACKUP_USERS.find(u => u.account.toLowerCase() === acc.toLowerCase() && u.password === pwd);
    if (backup) {
      initGameSession(backup);
    } else {
      msgEl.style.color = "var(--red)";
      msgEl.innerText = "❌ 連線失敗且查無此備用帳號（可用 test / 1234）";
      loginBtn.disabled = false;
    }
  }
}

function initGameSession(userObj) {
  currentUser = userObj;
  document.getElementById('login-modal').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('student-badge').innerText = `👤 ${currentUser.cls} ${currentUser.name}`;
  document.getElementById('timer-num').innerText = currentUser.totalTime;

  currentLevelIdx = Math.min(currentUser.completedLevels, LEVELS.length - 1);
  loadLevel(currentLevelIdx);

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    currentUser.totalTime++;
    document.getElementById('timer-num').innerText = currentUser.totalTime;
  }, 1000);
}

function getRabbitCarSVG() {
  return `
  <svg viewBox="0 0 100 100" width="100%" height="100%">
    <polygon points="50,2 32,24 68,24" fill="#ffeb3b" stroke="#d84315" stroke-width="4"/>
    <rect x="18" y="22" width="64" height="68" rx="18" fill="#26c6da" stroke="#00838f" stroke-width="4"/>
    <rect x="10" y="28" width="8" height="18" rx="4" fill="#333"/>
    <rect x="82" y="28" width="8" height="18" rx="4" fill="#333"/>
    <rect x="10" y="64" width="8" height="18" rx="4" fill="#333"/>
    <rect x="82" y="64" width="8" height="18" rx="4" fill="#333"/>
    <ellipse cx="42" cy="40" rx="6" ry="14" fill="#fff59d" stroke="#fbc02d" stroke-width="3"/>
    <ellipse cx="58" cy="40" rx="6" ry="14" fill="#fff59d" stroke="#fbc02d" stroke-width="3"/>
    <circle cx="50" cy="58" r="18" fill="#fff59d" stroke="#fbc02d" stroke-width="3"/>
    <circle cx="43" cy="54" r="3" fill="#333"/>
    <circle cx="57" cy="54" r="3" fill="#333"/>
    <circle cx="38" cy="60" r="3.5" fill="#ff8a80"/>
    <circle cx="62" cy="60" r="3.5" fill="#ff8a80"/>
  </svg>`;
}

function getFlagSVG() {
  return `
  <svg viewBox="0 0 100 100" width="75%" height="75%">
    <ellipse cx="45" cy="85" rx="22" ry="7" fill="#fff" stroke="#0288d1" stroke-width="4"/>
    <line x1="45" y1="15" x2="45" y2="85" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
    <polygon points="45,15 88,30 45,45" fill="#ff1744" stroke="#b71c1c" stroke-width="3"/>
  </svg>`;
}

function loadLevel(idx) {
  currentLevelIdx = idx;
  const lvl = LEVELS[idx];
  document.getElementById('lvl-num').innerText = lvl.level;

  const dirNames = ['⬆️ 朝上', '➡️ 朝右', '⬇️ 朝下', '⬅️ 朝左'];
  document.getElementById('start-dir-hint').innerText = `起始車頭：${dirNames[lvl.start.dir]}`;

  const board = document.getElementById('board');
  board.innerHTML = '';

  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 5; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (lvl.obstacles.some(o => o.x === x && o.y === y)) {
        cell.innerHTML = '<div class="obstacle-box"></div>';
      } else if (lvl.target.x === x && lvl.target.y === y) {
        cell.innerHTML = getFlagSVG();
      }
      board.appendChild(cell);
    }
  }

  const player = document.createElement('div');
  player.id = 'player';
  player.innerHTML = `<div id="player-inner">${getRabbitCarSVG()}</div>`;
  board.appendChild(player);

  playerState = { ...lvl.start };
  updatePlayerView();
  clearCmds();
}

function updatePlayerView() {
  const player = document.getElementById('player');
  const inner = document.getElementById('player-inner');
  if (!player || !inner) return;
  player.style.left = (playerState.x * 20) + '%';
  player.style.top = (playerState.y * 25) + '%';
  inner.style.transform = `rotate(${playerState.dir * 90}deg)`;
}

function dragCard(e, type) { e.dataTransfer.setData('text/plain', type); }
function dropCard(e) {
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  if (type) addCmd(type);
}

function addCmd(type) {
  if (isRunning) return;
  commands.push(type);
  renderCmds();
}
function removeCmd(idx) {
  if (isRunning) return;
  commands.splice(idx, 1);
  renderCmds();
}
function clearCmds() {
  if (isRunning) return;
  commands = [];
  renderCmds();
}

function renderCmds() {
  const list = document.getElementById('slot-list');
  list.innerHTML = '';
  const labels = { left: '↰ 轉左', move: '▶ 移動1格', right: '↱ 轉右' };
  commands.forEach((cmd, i) => {
    const item = document.createElement('div');
    item.className = `slot-item ${cmd}`;
    item.id = `cmd-step-${i}`;
    item.innerText = `${i + 1}. ${labels[cmd]}`;
    item.onclick = () => removeCmd(i);
    list.appendChild(item);
  });
  document.getElementById('step-count').innerText = `${commands.length} 步`;
}

async function runProgram() {
  if (isRunning || commands.length === 0) return;
  isRunning = true;
  document.getElementById('go-btn').disabled = true;

  const lvl = LEVELS[currentLevelIdx];
  playerState = { ...lvl.start };
  updatePlayerView();
  await new Promise(r => setTimeout(r, 300));

  let crashReason = null;
  for (let i = 0; i < commands.length; i++) {
    document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('active'));
    const stepEl = document.getElementById(`cmd-step-${i}`);
    if (stepEl) stepEl.classList.add('active');

    const cmd = commands[i];
    if (cmd === 'left') {
      playerState.dir = (playerState.dir + 3) % 4;
    } else if (cmd === 'right') {
      playerState.dir = (playerState.dir + 1) % 4;
    } else if (cmd === 'move') {
      if (playerState.dir === 0) playerState.y--;
      else if (playerState.dir === 1) playerState.x++;
      else if (playerState.dir === 2) playerState.y++;
      else if (playerState.dir === 3) playerState.x--;
    }

    updatePlayerView();
    await new Promise(r => setTimeout(r, 520));

    if (playerState.x < 0 || playerState.x >= 5 || playerState.y < 0 || playerState.y >= 4) {
      crashReason = 'boundary'; break;
    }
    if (lvl.obstacles.some(o => o.x === playerState.x && o.y === playerState.y)) {
      crashReason = 'obstacle'; break;
    }
  }

  document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('active'));

  if (!crashReason && playerState.x === lvl.target.x && playerState.y === lvl.target.y) {
    if (currentLevelIdx + 1 > currentUser.completedLevels) {
      currentUser.completedLevels = currentLevelIdx + 1;
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'updateProgress',
          account: currentUser.account,
          completedLevels: currentUser.completedLevels,
          totalTime: currentUser.totalTime
        })
      }).catch(e => console.warn(e));
    }
    if (currentLevelIdx + 1 < LEVELS.length) {
      showCustomAlert(`挑戰成功！進入第 ${currentLevelIdx + 2} 關！`, "🎉", () => {
        loadLevel(currentLevelIdx + 1);
      });
    } else {
      showCustomAlert(`太棒了！已全部通關！總共耗時 ${currentUser.totalTime} 秒！`, "🏆", () => {
        openRankModal();
      });
    }
  } else {
    let msg = '還沒走到紅旗終點喔，再試一次！';
    let icon = '🤔';
    if (crashReason === 'boundary') {
      msg = '哎呀！小兔子超出棋盤邊界了！';
      icon = '💥';
    } else if (crashReason === 'obstacle') {
      msg = '哎呀！撞到紅色障礙物了！';
      icon = '💥';
    }
    showCustomAlert(msg, icon, () => {
      playerState = { ...lvl.start };
      updatePlayerView();
    });
  }

  isRunning = false;
  document.getElementById('go-btn').disabled = false;
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function openLevelsModal() {
  renderLevelButtons();
  document.getElementById('levels-modal').style.display = 'flex';
}

function renderLevelButtons() {
  const grid = document.getElementById('level-grid');
  grid.innerHTML = '';
  const teacherMode = document.getElementById('teacher-unlock').checked;

  LEVELS.forEach((l, idx) => {
    const btn = document.createElement('button');
    const isDone = idx < currentUser.completedLevels;
    const isUnlocked = teacherMode || idx <= currentUser.completedLevels;

    btn.className = 'lvl-btn ' + (isDone ? 'done' : (isUnlocked ? 'unlocked' : ''));
    btn.innerText = isDone ? `${l.level} ✓` : (isUnlocked ? l.level : `${l.level} 🔒`);
    btn.disabled = !isUnlocked;
    btn.onclick = () => {
      loadLevel(idx);
      closeModal('levels-modal');
    };
    grid.appendChild(btn);
  });
}

async function openRankModal() {
  document.getElementById('rank-modal').style.display = 'flex';
  const tbody = document.getElementById('rank-tbody');
  tbody.innerHTML = '<tr><td colspan="5">正在從雲端載入即時排行榜...</td></tr>';

  try {
    const res = await fetch(GAS_URL + '?action=leaderboard');
    const data = await res.json();
    if (data.status === 'success' && Array.isArray(data.leaderboard)) {
      const list = data.leaderboard;
      list.sort((a, b) => {
        if (b.completedLevels !== a.completedLevels) return b.completedLevels - a.completedLevels;
        return a.totalTime - b.totalTime;
      });

      tbody.innerHTML = list.map((u, i) => `
        <tr style="${u.account === currentUser?.account ? 'background:#fff9c4;font-weight:bold;' : ''}">
          <td>${i === 0 ? '🥇 1' : i === 1 ? '🥈 2' : i === 2 ? '🥉 3' : i + 1}</td>
          <td>${u.cls}</td>
          <td>${u.name}</td>
          <td>${u.completedLevels} 關</td>
          <td>${u.totalTime} 秒</td>
        </tr>
      `).join('') || '<tr><td colspan="5">尚無紀錄</td></tr>';
      return;
    }
  } catch (e) {
    console.error(e);
  }
  tbody.innerHTML = '<tr><td colspan="5">無法取得排行榜資料（離線模式）</td></tr>';
}
</script>
</body>
